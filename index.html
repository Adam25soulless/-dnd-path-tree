<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100d14">
<title>شجرة المسار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#100d14;--glow:#2a1d38;--s1:#1a1620;--s2:#252030;--card-end:#151119;--sink:#16121b;--input:#0f0c13;--nav:#130f18;--bar:rgba(16,13,20,.92);--scrim:rgba(5,3,8,.72);--toast:#2a2232;--canvas:#0d0a11;--line:#3b3243;--line2:#2a2230;--ring1:#15111a;--ring2:#2d2535;--gold:#c9a24b;--gold2:#e8cb82;--tx:#ebe1ca;--mu:#a39886;--btn1:#d9b45a;--btn2:#a8812f;--btn-tx:#1a1205;--btn-bd:#e8cb82;--bad:#d04a3f;--bad-tx:#ffb3aa;--bad-tx2:#ffd0ca;--bad-a16:rgba(208,74,63,.16);--bad-a30:rgba(208,74,63,.3);--ok:#62ae72;--ok-tx:#a9dcb3;--evo:#2b2310;--edge:#4a4052;--edge2:#6b5d78;--str:#d1553f;--dex:#5fae6e;--con:#dc9440;--int:#4f8fd0;--wis:#9470cc;--cha:#d46f9f;--card-bg:linear-gradient(180deg,var(--s1),var(--card-end));--card-bd:var(--line)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(120% 70% at 50% -10%,var(--glow) 0,var(--bg) 58%) fixed;color:var(--tx);font:16px/1.7 Cairo,system-ui,sans-serif;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:Amiri,serif;margin:0;line-height:1.35;font-weight:700}
h1{font-size:30px}h2{font-size:24px}h3{font-size:20px}
a{color:var(--gold2);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.bar{position:sticky;top:0;z-index:20;background:var(--bar);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:12px}
.bar .t{font:700 23px Amiri,serif;color:var(--gold2);flex:1}
.floor{border:1px solid var(--gold);color:var(--gold2);border-radius:999px;padding:1px 14px;font-size:14px;white-space:nowrap}
.nav{position:fixed;inset:auto 0 0 0;z-index:20;display:flex;background:var(--nav);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav a{flex:1;text-align:center;padding:9px 4px 8px;color:var(--mu);font-size:13px}
.nav a.on{color:var(--gold2);box-shadow:inset 0 2px 0 var(--gold)}
.nav svg{display:block;margin:0 auto 1px}
.card{background:var(--card-bg);border:1px solid var(--card-bd);border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:inset 0 0 0 3px var(--ring1),inset 0 0 0 4px var(--ring2)}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}
.muted{color:var(--mu)}.sm{font-size:14px}
.btn{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:8px 16px;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--gold)}
.btn.sm{min-height:34px;padding:2px 12px;font-size:14px}
.btn.gold{background:linear-gradient(var(--btn1),var(--btn2));color:var(--btn-tx);border-color:var(--btn-bd);font-weight:700}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.in{width:100%;background:var(--input);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px}
.in:focus{border-color:var(--gold)}
label.f{display:block;margin:0 0 12px;font-size:14px;color:var(--mu)}
label.f .in{margin-top:4px;color:var(--tx);font-size:16px}
.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs .btn{flex:1}.tabs .btn.on{border-color:var(--gold);color:var(--gold2)}
.auth{max-width:420px;margin:7vh auto 0;padding:16px}
.auth h1{text-align:center;color:var(--gold2);font-size:40px;margin-bottom:4px}
.auth p.lead{text-align:center;color:var(--mu);margin:0 0 20px}
.list .it{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--sink);color:var(--tx);min-height:52px}
.list .it:hover{border-color:var(--gold)}
.head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.head h1{flex:1;min-width:0;overflow-wrap:anywhere}
.info{display:flex;gap:10px;flex-wrap:wrap}
.pill{border:1px solid var(--line);border-radius:999px;padding:1px 11px;background:var(--sink);font-size:14px}
.pill b{color:var(--gold2);font-weight:700}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.res .c{text-align:center;border:1px solid var(--line);border-radius:12px;padding:10px 4px;background:var(--sink);font-size:13px;color:var(--mu);line-height:1.4}
.res .c svg{color:var(--gold)}.res b{display:block;font:700 28px Amiri,serif;color:var(--tx)}
.sec{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}.sec h2{flex:1}
.ov{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--s1);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(28px);opacity:0}}
.step{display:flex;gap:8px;align-items:center;margin-bottom:14px}.step .in{text-align:center;font-size:20px}.step .btn{min-width:48px}
.toast{position:fixed;inset:auto 16px calc(92px + env(safe-area-inset-bottom)) 16px;z-index:60;max-width:520px;margin:auto;padding:12px 16px;border-radius:12px;background:var(--toast);border:1px solid var(--gold);text-align:center}
.toast.bad{border-color:var(--bad)}
.empty{text-align:center;color:var(--mu);padding:24px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{position:relative;border:1px solid var(--line);border-radius:12px;padding:8px 2px 6px;text-align:center;background:var(--sink);min-height:96px;width:100%;color:inherit;display:block}
.stat.can{cursor:pointer}.stat.can:hover,.stat.can:focus-visible{border-color:var(--gold)}
.stat .sigil{width:38px;height:38px;margin:0 auto 3px;border-radius:50%;display:grid;place-items:center;color:var(--c);border:2px solid var(--c);box-shadow:0 0 0 3px var(--sink),0 0 0 4px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 12px color-mix(in srgb,var(--c) 30%,transparent)}
.stat .v{font:700 25px/1.15 Amiri,serif;white-space:nowrap}
.stat .md{font:600 13px Cairo,sans-serif;color:var(--mu)}.stat .bn{font:600 13px Cairo,sans-serif;color:var(--gold2)}
.stat .n{font-size:13px;line-height:1.3}.stat .cap{font-size:11px;color:var(--mu)}
.stat .pb{position:absolute;top:5px;inset-inline-start:5px;width:20px;height:20px;border-radius:50%;background:linear-gradient(var(--btn1),var(--btn2));color:var(--btn-tx);display:grid;place-items:center}
.sigil{border-radius:50%;display:grid;place-items:center;color:var(--c);border:2px solid var(--c);box-shadow:0 0 0 4px var(--sink),0 0 0 5px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 18px color-mix(in srgb,var(--c) 30%,transparent)}
.rg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rc{border:1px solid var(--line);border-radius:10px;background:var(--sink);padding:8px 2px 6px;text-align:center;min-width:0}
.rc .ri{display:block;color:var(--c);line-height:0;margin-bottom:3px}.rc .rn{display:block;font-size:12px;color:var(--mu);line-height:1.3}.rc .rv{display:block;font:700 16px Cairo,sans-serif;direction:ltr}
.redit{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.redit .in{text-align:center}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{background:var(--s2);border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center;cursor:pointer;display:block}
.tcard.on{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 35%,transparent)}
.tprev{display:block;height:64px;border:1px solid;border-radius:9px;padding:6px;position:relative;overflow:hidden}
.tp1{display:block;height:100%;width:62%;border-radius:6px;padding:5px}.tp1 i{display:block;height:5px;border-radius:3px;margin-bottom:4px;width:85%}
.tp2{position:absolute;inset-inline-end:7px;bottom:7px;width:34%;height:14px;border-radius:5px}.tp3{position:absolute;inset-inline-end:7px;top:8px;width:18px;height:6px;border-radius:3px}
.tcard .tn{display:block;margin-top:6px;font:700 16px Amiri,serif}.tcard .te{display:block;font-size:11px;color:var(--mu);direction:ltr}
@media(max-width:380px){.bar{gap:8px;padding-inline:12px}.bar .t{font-size:19px}.floor{padding:0 9px;font-size:13px}}
.it2{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--sink)}
.it2 .ds{white-space:pre-wrap;margin:6px 0 0;line-height:1.8;overflow-wrap:anywhere}
.pill.bad{border-color:var(--bad);background:var(--bad-a16);color:var(--bad-tx)}
.pill.bad b{color:var(--bad-tx2)}
.dot{width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--ring1);align-self:center}
.dot.bad{background:var(--bad);box-shadow:0 0 0 3px var(--bad-a30)}

.tv{position:relative;height:calc(100dvh - 178px - env(safe-area-inset-bottom) - env(safe-area-inset-top));min-height:200px;max-width:100%;border:1px solid var(--line);border-radius:14px;background:var(--canvas);overflow:hidden;touch-action:none;cursor:grab}
.tv svg{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none}
.tv .tools{position:absolute;inset-block-end:10px;inset-inline-start:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.ed{fill:none;stroke:var(--line);stroke-width:2.5}.ed.on{stroke:var(--gold);opacity:.55}
.nd{color:var(--c,var(--gold));cursor:pointer}
.nd circle{fill:var(--sink);stroke:var(--c,var(--gold));stroke-width:3.2}
.nd .ring{fill:none;stroke-width:1.5;opacity:.7}
.nd.available:not(.buy) circle:first-child{stroke-dasharray:5 4}
.nd.buy circle:first-child{filter:drop-shadow(0 0 9px var(--c,var(--gold)))}
.nd.purchased{opacity:.5}
.nd text{fill:var(--tx);font:600 14px Cairo,sans-serif;paint-order:stroke;stroke:var(--canvas);stroke-width:4px;stroke-linejoin:round}
.rw{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;background:var(--sink)}
.rw .ds{white-space:pre-wrap;margin:6px 0 0;line-height:1.8;overflow-wrap:anywhere}
summary{cursor:pointer;font:700 20px Amiri,serif;color:var(--gold2);min-height:32px}
details.card[open] summary{margin-bottom:4px}
.arow{display:grid;grid-template-columns:70px 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.arow .in{min-height:40px;padding:4px 8px;text-align:center}
.brow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:var(--sink)}
.brow .in{min-height:40px;padding:4px 8px;text-align:center;flex:1;min-width:70px}
.lg{padding:6px 0;border-bottom:1px solid var(--line2)}
.trow{border:1px solid var(--line);border-inline-start:4px solid var(--c,var(--gold));border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--sink)}
.trow.del{opacity:.55}.trow.del b{text-decoration:line-through}
.chip{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--c);border:1.5px solid var(--c);flex:none}
.bdg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:0 10px;color:var(--mu)}
.tag.new{border-color:var(--ok);color:var(--ok-tx)}.tag.mod{border-color:var(--gold);color:var(--gold2)}.tag.rm{border-color:var(--bad);color:var(--bad-tx)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold)}

.ge-box{height:calc(100dvh - 500px);min-height:300px}
.ge .ln{fill:none;stroke:var(--edge2);stroke-width:2.5}.ge .hit{fill:none;stroke:transparent;stroke-width:24}.ge.sel .ln,.ge.hot .ln{stroke:var(--gold2);stroke-width:3.5}.ge.dim{opacity:.18}
.gn{color:var(--c,var(--gold));cursor:pointer}.gn circle:first-child{fill:var(--sink);stroke:var(--c,var(--gold));stroke-width:2.5}
.gn.evo circle:first-child{fill:var(--evo);stroke-width:3.5}.gn .ring{fill:none;stroke:var(--gold);stroke-width:1.5;opacity:.6}
.gn.sel circle:first-child{stroke-width:5;filter:drop-shadow(0 0 9px var(--c,var(--gold)))}.gn.bad circle:first-child{stroke:var(--bad);stroke-width:4}
.gn.linking circle:first-child{stroke-dasharray:6 4}.gn.dim{opacity:.22}.gn text{fill:var(--tx);font:600 12px Cairo,sans-serif}
.gn .mand{fill:var(--gold);stroke:var(--sink);stroke-width:2}.gn .hd{fill:var(--gold2);stroke:var(--sink);stroke-width:2;pointer-events:none}.gn .hdhit{fill:transparent;cursor:crosshair}
.tmpl{pointer-events:none;fill:none;stroke:var(--gold2);stroke-width:3;stroke-dasharray:7 5}
.gbar{display:none;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 8px;padding:6px;border:1px solid var(--line);border-radius:12px;background:var(--s1)}.gbar .btn{font-size:13px;padding:2px 9px;min-height:34px}.tbar{flex-wrap:wrap;gap:6px}
.btn.on{border-color:var(--gold);color:var(--gold2)}.btn.warn{border-color:var(--bad);color:var(--bad-tx)}

.tv svg .ed{fill:none;stroke:var(--edge);stroke-width:var(--ew,3.4)}.tv svg .ed.on{stroke:var(--gold);opacity:.8}
.nd.locked{opacity:.4}.nd.locked circle:first-child{stroke-dasharray:2 5}
.nd.evo circle:first-child{fill:var(--evo);stroke-width:3.5}.nd .ring2{fill:none;stroke:var(--gold);stroke-width:1.5;opacity:.6}.nd.sealed .ring2{stroke:var(--ok);stroke-width:2.5;opacity:.9}
.nd .mand{fill:var(--gold);stroke:var(--sink);stroke-width:2}
.stg{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line2)}.stg:last-child{border:0}
.okc{color:var(--ok-tx)}

.wrap.wide{padding:8px 8px 0;max-width:none}
.trow2{display:flex;align-items:center;gap:6px;margin-bottom:8px}.trow2 .pill{font-size:16px;padding:3px 14px}.trow2 .btn.sm{min-height:38px}
.tvmsg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--mu);text-align:center;padding:20px;pointer-events:none}
html,body{overflow-x:hidden}
</style>

/* ---- boot ---- */
async function boot(){
 const{data:{session}}=await sb.auth.getSession();
 S.me=null;
 if(session){try{S.me=await rpc('me')}catch(e){}}
 if(!S.me){if(session)await sb.auth.signOut();return authScreen()}
 if(S.me.theme&&S.me.theme!==document.documentElement.getAttribute('data-theme'))applyTheme(S.me.theme);
 shell();go()}
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'){S.me=null;authScreen()}});
boot();
</script>
